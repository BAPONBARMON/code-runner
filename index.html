<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
*{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body{
  margin: 0;
  padding: 0;
  height: 100dvh;
  background: #0a0a0c;
  font-family: Consolas, monospace;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== TOOLBAR ===== */
.toolbar{
  display: flex;
  gap: 4px;
  padding: 6px 4px;
  justify-content: center;
  align-items: center;
  border-bottom: 1px solid #00ff7f33;
  background: #121216;
  z-index: 10;
  flex-wrap: wrap;
}

/* ===== BUTTON STYLE ===== */
.ctrl-btn{
  height: 28px;
  padding: 0 8px;
  background: #1a1a24;
  color: #00ff7f;
  border: 1px solid #00ff7f88;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1;
}

.ctrl-btn:hover{
  background: #00ff7f;
  color: #000;
}

.ctrl-btn:active, .btn-pressed{
  transform: scale(0.94);
}

.editor-wrapper{
  flex: 1;
  min-height: 0;
  position: relative;
  padding-bottom: 48px; /* space for run bar */
}

#editor{
  width: 100%;
  height: 100%;
}

#plainEditor{
  display: none;
  height: 100%;
  background: #0a0a0c;
}

#lineNumbers{
  width: 35px;
  padding: 10px 2px;
  text-align: right;
  color: #00ff7f66;
  font-size: 12px;
  line-height: 1.6;
  user-select: none;
  overflow: hidden;
  border-right: 1px solid #00ff7f22;
}

#mobileEditor{
  flex: 1;
  background: #0a0a0c;
  color: #00ff7f;
  border: none;
  outline: none;
  resize: none;
  padding: 8px;
  font-family: Consolas, monospace;
  font-size: 13px;
  line-height: 1.6;
  caret-color: #00ff7f;
  overflow: auto;
}

.run-bar{
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 48px !important;
  padding: 0 12px !important;
  border-top: 1px solid #00ff7f33;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 8px !important;
  background: #121216 !important;
  z-index: 1000 !important;
  flex-wrap: nowrap !important;
}

.run-bar-center {
  display: flex !important;
  align-items: center !important;
  gap: 4px !important;
  justify-content: center !important;
  min-width: 0 !important;
}

.save-input{
  height: 32px !important;
  background: #1a1a24;
  border: 1px solid #00ff7f66;
  color: #00ff7f;
  border-radius: 6px;
  padding: 0 6px;
  font-size: 11px;
  outline: none;
  width: 65px !important;
  min-width: 45px !important;
}

.ext-select{
  height: 32px !important;
  background: #1a1a24;
  border: 1px solid #00ff7f66;
  color: #00ff7f;
  border-radius: 6px;
  padding: 0 2px;
  font-size: 11px;
  outline: none;
  cursor: pointer;
}

.custom-ext-wrapper {
  display: none;
  align-items: center;
  gap: 2px;
}

.custom-ext-input {
  height: 32px !important;
  background: #1a1a24;
  border: 1px solid #00ff7f66;
  color: #00ff7f;
  border-radius: 6px;
  padding: 0 4px;
  font-size: 11px;
  outline: none;
  width: 45px !important;
}

.back-ext-btn {
  height: 32px !important;
  padding: 0 5px;
  background: #2a1a1a;
  color: #ff5555;
  border: 1px solid #ff555588;
  border-radius: 6px;
  font-size: 10px;
  cursor: pointer;
}

.toggle-btn{
  height: 32px !important;
  padding: 0 8px !important;
  background: #1a1a24;
  color: #00ff7f;
  border: 1px solid #00ff7f88;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0 !important;
}

.save-btn{
  height: 32px !important;
  padding: 0 8px !important;
  font-size: 11px;
  flex-shrink: 0 !important;
}

.run-btn{
  height: 32px !important;
  padding: 0 12px !important;
  background: linear-gradient(135deg, #00ff7f, #00b359);
  color: #000;
  border: none;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,255,127,0.3);
  white-space: nowrap;
  flex-shrink: 0 !important;
}

/* Monaco Find Match Counter Fix */
.monaco-editor .find-widget {
  min-width: 280px !important;
  max-width: 95vw !important;
  right: 10px !important;
}

.monaco-editor .find-widget .matchesCount {
  display: inline-block !important;
  visibility: visible !important;
  min-width: 45px !important;
  font-size: 11px !important;
}

#runner{
  position: fixed;
  inset: 0;
  background: #0a0a0c;
  display: none;
  z-index: 9999;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.floating-bar{
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 10000;
}

/* SMALLER COMPACT ICON BUTTONS */
.icon-only-btn{
  width: 32px !important;
  height: 32px !important;
  padding: 0 !important;
  background: #121216 !important;
  color: #00ff7f !important;
  border: 1px solid #00ff7f88 !important;
  border-radius: 50% !important;
  font-size: 14px !important;
  font-weight: 900 !important;
  cursor: pointer !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-shadow: 0 3px 8px rgba(0,0,0,0.6) !important;
  transition: transform 0.2s, background 0.2s, box-shadow 0.2s !important;
}

.icon-only-btn:hover{
  background: #00ff7f !important;
  color: #000 !important;
  transform: scale(1.08);
}

.icon-only-btn.active-mobile{
  background: #00ff7f !important;
  color: #000 !important;
  box-shadow: 0 0 12px #00ff7f !important;
}

.icon-close-btn{
  color: #ff5555 !important;
  border-color: #ff555588 !important;
}

.icon-close-btn:hover{
  background: #ff5555 !important;
  color: #fff !important;
}

.phone-shell {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* REALISTIC MOBILE PREVIEW MODE */
.phone-shell.mobile-mode {
  width: 375px;
  height: 720px;
  max-width: 90vw;
  max-height: 82vh;
  border-radius: 38px;
  border: 10px solid #1f1f28;
  box-shadow: 0 0 0 2px #333344, 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 255, 127, 0.25);
  overflow: hidden;
  background: #fff;
}

#output{
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
  transition: all 0.3s ease;
}

/* ===== COPY TOAST ===== */
#copyToast{
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.6);
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  z-index: 10001;
}
#copyToast span{
  background: #00ff7f;
  color: #000;
  padding: 10px 20px;
  border-radius: 10px;
  font-weight: 900;
  font-size: 12px;
}
#copyToast.show{opacity: 1;}

/* Light Transparent Yellow Find Highlight */
.monaco-editor .findMatch {
  background-color: rgba(255, 235, 59, 0.35) !important;
  color: inherit !important;
  border: 1px solid rgba(255, 235, 59, 0.8);
}
.monaco-editor .currentFindMatch {
  background-color: rgba(255, 215, 0, 0.65) !important;
  color: #000 !important;
  font-weight: bold;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>

<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="ctrl-btn" onclick="pasteCode()">Paste</button>
  <button class="ctrl-btn" onclick="clearCode()">Clear</button>
  <button class="ctrl-btn" onclick="copyAllCode()">Copy</button>
  <button class="ctrl-btn" onclick="undoCode()">Undo</button>
  <button class="ctrl-btn" onclick="redoCode()">Redo</button>
  <button class="ctrl-btn" onclick="triggerFind()">Find</button>
</div>

<!-- EDITOR -->
<div class="editor-wrapper">
  <div id="editor"></div>

  <div id="plainEditor">
    <div id="lineNumbers"></div>
    <textarea id="mobileEditor"></textarea>
  </div>
</div>

<!-- RUN BAR -->
<div class="run-bar">
  <button class="toggle-btn" id="toggleBtn" onclick="toggleMonaco()">M-ON</button>
  
  <!-- SAVE FILE SECTION -->
  <div class="run-bar-center">
    <input type="text" id="fileName" class="save-input" placeholder="file" value="index">
    
    <!-- DROPDOWN -->
    <select id="fileExt" class="ext-select" onchange="checkCustomExt(this.value)">
      <option value=".html">.html</option>
      <option value=".css">.css</option>
      <option value=".js">.js</option>
      <option value=".json">.json</option>
      <option value=".txt">.txt</option>
      <option value="other">Other...</option>
    </select>

    <!-- CUSTOM EXTENSION INPUT -->
    <div id="customExtWrapper" class="custom-ext-wrapper">
      <input type="text" id="customExt" class="custom-ext-input" placeholder=".ext">
      <button class="back-ext-btn" onclick="resetExtDropdown()">✕</button>
    </div>

    <button class="ctrl-btn save-btn" onclick="saveToFile()">Save</button>
  </div>

  <button class="run-btn" onclick="runCode()">Run Code ►</button>
</div>

<div id="runner">
  <div class="floating-bar">
    <button class="icon-only-btn" onclick="refreshRun()" title="Refresh">↻</button>
    <button class="icon-only-btn" id="mobBtn" onclick="toggleMobileMode()" title="Switch to Mobile View">📱</button>
    <button class="icon-only-btn icon-close-btn" onclick="closeRun()" title="Close">✕</button>
  </div>
  <div id="phoneShell" class="phone-shell">
    <iframe id="output"></iframe>
  </div>
</div>

<div id="copyToast"><span>Copied Successfully!</span></div>

<script>
let editor;
let monacoEnabled = true;
let cursorOffset = 0;

const mobileEditor = document.getElementById('mobileEditor');
const lineNumbers = document.getElementById('lineNumbers');
const toggleBtn = document.getElementById('toggleBtn');

/* ===== MONACO INIT ===== */
require.config({ paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'} });
require(['vs/editor/editor.main'], function(){
  editor = monaco.editor.create(document.getElementById('editor'), {
    value: `<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; color: #333; }
    h1 { color: #00b359; }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <p>Real page preview!</p>
</body>
</html>`,
    language: 'html',
    theme: 'vs-dark',
    automaticLayout: true,
    minimap: { enabled: false },
    contextmenu: false
  });

  editor.onDidChangeCursorPosition(() => {
    if(monacoEnabled){
      cursorOffset = editor.getModel().getOffsetAt(editor.getPosition());
    }
  });

  updateToggleText();
});

/* ===== LINE NUMBERS ===== */
function updateLineNumbers(){
  const lines = mobileEditor.value.split('\n').length;
  let html = '';
  for(let i=1; i<=lines; i++) html += i + '<br>';
  lineNumbers.innerHTML = html;
}

mobileEditor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = mobileEditor.scrollTop;
});
['input','click','keyup','select'].forEach(e => {
  mobileEditor.addEventListener(e, () => {
    cursorOffset = mobileEditor.selectionStart || 0;
    updateLineNumbers();
  });
});

/* ===== TOGGLE MONACO ===== */
function updateToggleText(){
  const isMobile = window.innerWidth <= 600;
  if(monacoEnabled){
    toggleBtn.textContent = isMobile ? 'M-ON' : 'Monaco ON';
  } else {
    toggleBtn.textContent = isMobile ? 'M-OFF' : 'Monaco OFF';
  }
}

window.addEventListener('resize', updateToggleText);

function toggleMonaco(){
  monacoEnabled = !monacoEnabled;
  updateToggleText();

  if(monacoEnabled){
    editor.setValue(mobileEditor.value);
    const pos = editor.getModel().getPositionAt(cursorOffset);
    editor.setPosition(pos);
    editor.focus();
    document.getElementById('editor').style.display = 'block';
    document.getElementById('plainEditor').style.display = 'none';
  } else {
    mobileEditor.value = editor.getValue();
    updateLineNumbers();
    document.getElementById('editor').style.display = 'none';
    document.getElementById('plainEditor').style.display = 'flex';
    mobileEditor.focus();
    mobileEditor.setSelectionRange(cursorOffset, cursorOffset);
  }
}

/* ===== GET CODE ===== */
function getCode(){
  return monacoEnabled ? editor.getValue() : mobileEditor.value;
}

/* ===== ACTIONS ===== */
async function pasteCode(){
  try {
    const t = await navigator.clipboard.readText();
    if(monacoEnabled){
      editor.executeEdits('', [
        { range: editor.getModel().getFullModelRange(), text: editor.getValue() + t }
      ]);
    } else {
      mobileEditor.setRangeText(t, cursorOffset, cursorOffset, 'end');
      updateLineNumbers();
    }
  } catch(err) {
    alert('Clipboard read access denied.');
  }
}

function clearCode(){
  if(monacoEnabled){
    editor.pushUndoStop();
    editor.executeEdits('', [
      { range: editor.getModel().getFullModelRange(), text: '' }
    ]);
    editor.pushUndoStop();
    cursorOffset = 0;
  } else {
    mobileEditor.value = '';
    updateLineNumbers();
    cursorOffset = 0;
  }
}

function copyAllCode(){
  navigator.clipboard.writeText(getCode());
  const copyToast = document.getElementById('copyToast');
  copyToast.classList.add('show');
  setTimeout(() => copyToast.classList.remove('show'), 1000);
}

function undoCode(){ if(monacoEnabled) editor.trigger('keyboard', 'undo'); }
function redoCode(){ if(monacoEnabled) editor.trigger('keyboard', 'redo'); }

/* ===== FIND BUTTON FUNCTION ===== */
function triggerFind(){ 
  if(monacoEnabled) {
    editor.trigger('keyboard', 'actions.find');
  } else {
    alert("Find function works best in Monaco ON mode.");
  }
}

/* ===== CUSTOM EXTENSION LOGIC ===== */
function checkCustomExt(val){
  const fileExtSelect = document.getElementById('fileExt');
  const customWrapper = document.getElementById('customExtWrapper');
  const customInput = document.getElementById('customExt');

  if(val === 'other'){
    fileExtSelect.style.display = 'none';
    customWrapper.style.display = 'inline-flex';
    customInput.focus();
  }
}

function resetExtDropdown(){
  const fileExtSelect = document.getElementById('fileExt');
  const customWrapper = document.getElementById('customExtWrapper');
  
  customWrapper.style.display = 'none';
  fileExtSelect.style.display = 'inline-block';
  fileExtSelect.value = '.html';
}

/* ===== SAVE FILE FUNCTION ===== */
function saveToFile(){
  const code = getCode();
  const nameInput = document.getElementById('fileName').value.trim() || 'code';
  const fileExtSelect = document.getElementById('fileExt');
  
  let ext = fileExtSelect.value;
  
  if(fileExtSelect.style.display === 'none'){
    let customVal = document.getElementById('customExt').value.trim();
    if(!customVal) customVal = '.txt';
    if(!customVal.startsWith('.')) customVal = '.' + customVal;
    ext = customVal;
  }

  const fullFileName = nameInput + ext;

  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = fullFileName;
  link.click();
  URL.revokeObjectURL(link.href);
}

function runCode(){
  const output = document.getElementById('output');
  const runner = document.getElementById('runner');
  output.srcdoc = getCode();
  runner.style.display = 'flex';
}

function refreshRun(){ 
  const output = document.getElementById('output');
  output.srcdoc = output.srcdoc; 
}

function closeRun(){ 
  document.getElementById('runner').style.display = 'none'; 
}

/* TOGGLE REAL MOBILE PREVIEW & BUTTON ICON SWITCH */
function toggleMobileMode(){
  const phoneShell = document.getElementById('phoneShell');
  const mobBtn = document.getElementById('mobBtn');
  
  const isMobile = phoneShell.classList.toggle('mobile-mode');
  mobBtn.classList.toggle('active-mobile', isMobile);
  
  if (isMobile) {
    mobBtn.textContent = '💻';
    mobBtn.title = 'Switch to Desktop View';
  } else {
    mobBtn.textContent = '📱';
    mobBtn.title = 'Switch to Mobile View';
  }
}

/* Button glow effect on touch */
document.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('touchstart', () => btn.classList.add('btn-pressed'), {passive: true});
  btn.addEventListener('touchend', () => setTimeout(() => btn.classList.remove('btn-pressed'), 120));
});
</script>

</body>
</html>
