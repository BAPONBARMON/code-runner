<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

/* ===== PAGE ===== */
html, body{
  margin:0;
  padding:0;
  height:100dvh;
  background:#000;
  font-family:Consolas, monospace;
  display:flex;
  flex-direction:column;
}

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;
  gap:8px;
  padding:10px;
  background:#000;
  border-bottom:1px solid #00ff7f33;
}

.toolbar button{
  flex:1;
  background:#00ff7f;
  color:#000;
  border:none;
  padding:10px;
  font-weight:bold;
  border-radius:6px;
}

.toolbar input{
  flex:1.5;
  background:#111;
  color:#fff;
  border:1px solid #00ff7f55;
  padding:10px;
  border-radius:6px;
}

/* ===== EDITOR ===== */
.editor-wrapper{
  flex:1;
  min-height:0;
  overscroll-behavior: contain;
}

/* 🔴 IMPORTANT: enable long-press select */
#editor{
  width:100%;
  height:100%;
  -webkit-overflow-scrolling: touch;
  user-select: text !important;
  -webkit-user-select: text !important;
}

/* ===== RUN BAR ===== */
.run-bar{
  position:sticky;
  bottom:0;
  padding:10px;
  background:#000;
  border-top:1px solid #00ff7f33;
}

.run-bar button{
  width:100%;
  padding:14px;
  font-size:16px;
  background:#00ff7f;
  border:none;
  border-radius:6px;
  font-weight:bold;
}

/* ===== OUTPUT ===== */
#runner{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  z-index:9999;
}

#runner button{
  background:#ff004f;
  color:#fff;
  border:none;
  padding:10px;
}

iframe{
  flex:1;
  border:none;
  background:#fff;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>

<body>

<!-- ===== TOOLBAR ===== -->
<div class="toolbar">
  <button onclick="pasteCode()">Paste</button>
  <button onclick="clearCode()">Clear</button>
  <input id="findBox" placeholder="Find…" oninput="findText(this.value)">
</div>

<!-- ===== EDITOR ===== -->
<div class="editor-wrapper">
  <div id="editor"></div>
</div>

<!-- ===== RUN ===== -->
<div class="run-bar">
  <button onclick="runCode()">▶ Run Code</button>
</div>

<!-- ===== OUTPUT ===== -->
<div id="runner">
  <button onclick="closeRun()">Close</button>
  <iframe id="output"></iframe>
</div>

<script>
let editor;

/* ===== LOAD MONACO ===== */
require.config({
  paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}
});

require(['vs/editor/editor.main'],function(){
  editor = monaco.editor.create(document.getElementById('editor'),{
    value:`<!DOCTYPE html>
<html>
<body>
<h1>Hello World</h1>
</body>
</html>`,
    language:'html',
    theme:'vs-dark',
    automaticLayout:true,
    minimap:{enabled:false},

    /* MOBILE SAFE OPTIONS */
    autoFocus:false,
    contextmenu:true,
    selectionClipboard:true,
    copyWithSyntaxHighlighting:false
  });

  /* prevent keyboard auto open */
  setTimeout(()=>editor.blur(),0);
});

/* ===== ACTIONS ===== */
async function pasteCode(){
  const t = await navigator.clipboard.readText();
  editor.setValue(editor.getValue()+t);
}

function clearCode(){
  editor.setValue('');
}

function findText(q){
  if(!q){
    editor.setSelection(null);
    return;
  }
  editor.trigger('keyboard','actions.find',{searchString:q});
}

function runCode(){
  document.getElementById('output').srcdoc = editor.getValue();
  document.getElementById('runner').style.display='flex';
}

function closeRun(){
  document.getElementById('runner').style.display='none';
}
</script>

</body>
</html>
