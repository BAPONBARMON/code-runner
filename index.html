<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

/* ===== PAGE ===== */
html,body{
  margin:0;
  padding:0;
  height:100dvh;
  background:#000;
  font-family:Consolas, monospace;
  display:flex;
  flex-direction:column;
}

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;
  gap:6px;
  padding:8px;
  justify-content:center;
  align-items:center;
  border-bottom:1px solid #00ff7f55;
  background:#000;
  z-index:10;
}

/* ===== BUTTON STYLE ===== */
.ctrl-btn,
.find-input,
.toggle-btn{
  width:72px;
  height:36px;
  background:#000;
  color:#00ff7f;
  border:2px solid #00ff7f;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}
.toggle-btn{ width:90px; }

.run-btn{
  flex:1;
  height:40px;
  background:#00ff7f;
  color:#000;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:900;
}

/* ===== BUTTON GLOW ===== */
.btn-pressed{
  box-shadow:0 0 14px #00ff7f;
  transform:scale(0.96);
}

/* ===== FIND ===== */
.find-input{
  outline:none;
  text-align:center;
}
.find-input:focus::placeholder{color:transparent}

/* ===== EDITOR WRAPPER ===== */
.editor-wrapper{
  flex:1;
  min-height:0;
  position:relative;
  padding-bottom:72px; /* space for fixed run bar */
}

/* ===== MONACO ===== */
#editor{
  width:100%;
  height:100%;
}

/* ===== MONACO OFF (TEXTAREA + LINE NUMBERS) ===== */
#plainEditor{
  display:none;
  height:100%;
  display:flex;
  background:#000;
}

#lineNumbers{
  width:48px;
  padding:10px 6px;
  text-align:right;
  color:#00ff7f66;
  font-size:14px;
  line-height:1.6;
  user-select:none;
  overflow:hidden;
  border-right:1px solid #00ff7f33;
}

#mobileEditor{
  flex:1;
  background:#000;
  color:#00ff7f;
  border:none;
  outline:none;
  resize:none;
  padding:10px;
  font-family:Consolas, monospace;
  font-size:14px;
  line-height:1.6;
  caret-color:#00ff7f;
  overflow:auto;
}

/* ===== RUN BAR (FIXED) ===== */
.run-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  padding:8px;
  border-top:1px solid #00ff7f55;
  display:flex;
  gap:8px;
  background:#000;
  z-index:1000;
}

/* ===== RUNNER ===== */
#runner{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  z-index:9999;
}
.runner-bar{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:6px;
  background:#050505;
  border-bottom:2px solid #00ff7f88;
}
#output{
  flex:1;
  border:none;
  background:#fff;
}

/* ===== COPY TOAST ===== */
#copyToast{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#00000088;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}
#copyToast span{
  background:#00ff7f;
  color:#000;
  padding:16px 28px;
  border-radius:16px;
  font-weight:900;
}
#copyToast.show{opacity:1}

/* ===== FIND HIGHLIGHT ===== */
.monaco-editor .findMatch{
  background:#ffff00 !important;
  color:#000 !important;
}
.monaco-editor .currentFindMatch{
  background:#ffeb3b !important;
  color:#000 !important;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>

<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="ctrl-btn" onclick="pasteCode()">Paste</button>
  <button class="ctrl-btn" onclick="clearCode()">Clear</button>
  <button class="ctrl-btn" onclick="copyAllCode()">Copy</button>
  <button class="ctrl-btn" onclick="undoCode()">Undo</button>
  <button class="ctrl-btn" onclick="redoCode()">Redo</button>
  <input class="find-input" placeholder="Find" oninput="findText(this.value)">
</div>

<!-- EDITOR -->
<div class="editor-wrapper">
  <div id="editor"></div>

  <div id="plainEditor">
    <div id="lineNumbers"></div>
    <textarea id="mobileEditor"></textarea>
  </div>
</div>

<!-- RUN BAR -->
<div class="run-bar">
  <button class="toggle-btn" id="toggleBtn" onclick="toggleMonaco()">Monaco ON</button>
  <button class="run-btn" onclick="runCode()">Run Code</button>
</div>

<!-- RUNNER -->
<div id="runner">
  <div class="runner-bar">
    <button class="ctrl-btn" onclick="refreshRun()">Refresh</button>
    <button class="ctrl-btn" onclick="closeRun()">Close</button>
  </div>
  <iframe id="output"></iframe>
</div>

<div id="copyToast"><span>Copy Successfully</span></div>

<script>
let editor;
let monacoEnabled = true;
let cursorOffset = 0;

const mobileEditor = document.getElementById('mobileEditor');
const lineNumbers = document.getElementById('lineNumbers');
const toggleBtn = document.getElementById('toggleBtn');

/* ===== MONACO INIT ===== */
require.config({ paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'} });
require(['vs/editor/editor.main'],function(){
  editor = monaco.editor.create(document.getElementById('editor'),{
    value:`<!DOCTYPE html>
<html>
<body>
<h1>Hello World</h1>
</body>
</html>`,
    language:'html',
    theme:'vs-dark',
    automaticLayout:true,
    minimap:{enabled:false},
    contextmenu:false
  });

  editor.onDidChangeCursorPosition(()=>{
    if(monacoEnabled){
      cursorOffset = editor.getModel().getOffsetAt(editor.getPosition());
    }
  });
});

/* ===== LINE NUMBERS ===== */
function updateLineNumbers(){
  const lines = mobileEditor.value.split('\n').length;
  let html='';
  for(let i=1;i<=lines;i++) html += i+'<br>';
  lineNumbers.innerHTML = html;
}

mobileEditor.addEventListener('scroll',()=>{
  lineNumbers.scrollTop = mobileEditor.scrollTop;
});
['input','click','keyup','select'].forEach(e=>{
  mobileEditor.addEventListener(e,()=>{
    cursorOffset = mobileEditor.selectionStart || 0;
    updateLineNumbers();
  });
});

/* ===== TOGGLE ===== */
function toggleMonaco(){
  monacoEnabled = !monacoEnabled;
  toggleBtn.textContent = monacoEnabled ? 'Monaco ON' : 'Monaco OFF';

  if(monacoEnabled){
    editor.setValue(mobileEditor.value);
    const pos = editor.getModel().getPositionAt(cursorOffset);
    editor.setPosition(pos);
    editor.focus();
    document.getElementById('editor').style.display='block';
    document.getElementById('plainEditor').style.display='none';
  }else{
    mobileEditor.value = editor.getValue();
    updateLineNumbers();
    document.getElementById('editor').style.display='none';
    document.getElementById('plainEditor').style.display='flex';
    mobileEditor.focus();
    mobileEditor.setSelectionRange(cursorOffset,cursorOffset);
  }
}

/* ===== COMMON ===== */
function getCode(){
  return monacoEnabled ? editor.getValue() : mobileEditor.value;
}

/* ===== ACTIONS ===== */
async function pasteCode(){
  const t = await navigator.clipboard.readText();
  if(monacoEnabled){
    editor.executeEdits('',[
      {range:editor.getModel().getFullModelRange(),text:editor.getValue()+t}
    ]);
  }else{
    mobileEditor.setRangeText(t,cursorOffset,cursorOffset,'end');
    updateLineNumbers();
  }
}

function clearCode(){
  if(monacoEnabled){
    editor.pushUndoStop();
    editor.executeEdits('',[
      {range:editor.getModel().getFullModelRange(),text:''}
    ]);
    editor.pushUndoStop();
    cursorOffset=0;
  }else{
    mobileEditor.value='';
    updateLineNumbers();
    cursorOffset=0;
  }
}

function copyAllCode(){
  navigator.clipboard.writeText(getCode());
  copyToast.classList.add('show');
  setTimeout(()=>copyToast.classList.remove('show'),1000);
}

function undoCode(){ if(monacoEnabled) editor.trigger('keyboard','undo'); }
function redoCode(){ if(monacoEnabled) editor.trigger('keyboard','redo'); }
function findText(q){ if(q && monacoEnabled) editor.trigger('keyboard','actions.find',{searchString:q}); }

function runCode(){
  output.srcdoc = getCode();
  runner.style.display='flex';
}
function refreshRun(){ output.srcdoc = output.srcdoc; }
function closeRun(){ runner.style.display='none'; }

/* ===== BUTTON GLOW ===== */
document.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('touchstart',()=>btn.classList.add('btn-pressed'),{passive:true});
  btn.addEventListener('touchend',()=>setTimeout(()=>btn.classList.remove('btn-pressed'),120));
});
</script>

</body>
</html>
